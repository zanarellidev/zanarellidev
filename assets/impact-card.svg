<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="180" fill="none">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="820" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080b16" />
      <stop offset="50%" stop-color="#0d1322" />
      <stop offset="100%" stop-color="#080b16" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="820" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4dd6e8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec5a76" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#4dd6e8" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7bf0fc" />
      <stop offset="100%" stop-color="#38bcd0" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff758f" />
      <stop offset="100%" stop-color="#e04866" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166" />
      <stop offset="100%" stop-color="#f4a261" />
    </linearGradient>
    <filter id="shadow" x="-4" y="-4" width="828" height="188" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="10" y="10" width="800" height="160" rx="14" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.2" filter="url(#shadow)" />
  
  <!-- Glowing Top Border -->
  <path d="M 24 10 L 796 10" stroke="url(#accentGlow)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Column Dividers -->
  <line x1="280" y1="30" x2="280" y2="150" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="545" y1="30" x2="545" y2="150" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Column 1: Upstream Merges -->
  <g transform="translate(30, 0)">
    <text x="0" y="44" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" text-transform="uppercase">UPSTREAM CONTRIBUTIONS</text>
    <text x="0" y="98" fill="url(#cyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">14+</text>
    <text x="0" y="124" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">PRs em Produção</text>
    <text x="0" y="144" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">OPA · K8s · Istio · Hop · Prometheus</text>
  </g>

  <!-- Column 2: Security & CVEs -->
  <g transform="translate(305, 0)">
    <text x="0" y="44" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" text-transform="uppercase">VULNERABILITY RESEARCH</text>
    <text x="0" y="98" fill="url(#roseGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.03em">6</text>
    <text x="0" y="124" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">CVEs &amp; Advisories Aceitos</text>
    <text x="0" y="144" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Airflow · BuildKit · Hop · Spring · Kyverno</text>
  </g>

  <!-- Column 3: Stack & Domains -->
  <g transform="translate(570, 0)">
    <text x="0" y="44" fill="#8b9bb4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" text-transform="uppercase">SPECIALIZATION</text>
    
    <!-- Tag 1 -->
    <rect x="0" y="60" width="105" height="24" rx="6" fill="#132338" stroke="#224263" stroke-width="1" />
    <text x="52" y="76" fill="#4dd6e8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cloud-Native</text>

    <!-- Tag 2 -->
    <rect x="115" y="60" width="105" height="24" rx="6" fill="#2b1424" stroke="#5c1d42" stroke-width="1" />
    <text x="167" y="76" fill="#ec5a76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AppSec / CVEs</text>

    <!-- Tag 3 -->
    <rect x="0" y="94" width="70" height="24" rx="6" fill="#131e2e" stroke="#1e3a5f" stroke-width="1" />
    <text x="35" y="110" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Golang</text>

    <!-- Tag 4 -->
    <rect x="78" y="94" width="70" height="24" rx="6" fill="#1c1d1a" stroke="#4a4220" stroke-width="1" />
    <text x="113" y="110" fill="#fde047" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Python</text>

    <!-- Tag 5 -->
    <rect x="156" y="94" width="64" height="24" rx="6" fill="#15242b" stroke="#1d4d4b" stroke-width="1" />
    <text x="188" y="110" fill="#5eead4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">K8s / CNI</text>

    <!-- Bottom note -->
    <text x="0" y="144" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sistemas Críticos &amp; Plataformas</text>
  </g>
</svg>
